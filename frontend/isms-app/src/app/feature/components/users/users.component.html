<div class="container mx-auto py-2">
  <!-- <app-message
    *ngIf="statusMsg() as msg"
    [message]="msg.message"
    [type]="msg.type"
  >
  </app-message> -->
  <div
    class="flex sm:flex-row sm:justify-between flex-col items-center md:justify-between sm:gap-4 py-3 px-6 bg-white mb-3 rounded-md border border-gray-200"
  >
    <mat-form-field
      appearance="outline"
      subscriptSizing="dynamic"
      class="w-full sm:w-fit my-2"
    >
      <mat-label>Search</mat-label>

      <input matInput (keyup)="applyFilter($event)" #input />
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>

    <button
      mat-stroked-button
      class="my-2 sm:my-4"
      (click)="openAddUserDialog()"
    >
      Add New User
    </button>
  </div>
  <div>
    <mat-card appearance="outlined" class="!bg-white">
      <mat-card-header
        class="flex flex-col justify-start sm:flex-row sm:items-center sm:justify-between"
      >
        <mat-card-title>Users</mat-card-title>
        <mat-card-subtitle>Manage Users</mat-card-subtitle>
        <mat-paginator
          [pageSizeOptions]="[5, 10, 25]"
          aria-label="Select page of users"
          class="w-full sm:w-fit my-2 py-2 !bg-white"
          (page)="onPageChange($event)"
          [length]="totalUsers"
        >
          >
        </mat-paginator>
      </mat-card-header>
      <mat-card-content class="overflow-x-auto">
        <div
          *ngIf="!dataSource"
          class="flex flex-col items-center justify-center py-4"
        >
          <mat-spinner diameter="45"></mat-spinner>
        </div>
        <table
          mat-table
          [dataSource]="dataSource"
          class="p-2 !border !border-solid !border-gray-400 rounded-lg !bg-white"
        >
          <!-- ID Column -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let row">{{ row.id }}</td>
          </ng-container>

          <!-- email Column -->
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let row">{{ row.email }}</td>
          </ng-container>

          <!-- First Name Column -->
          <ng-container matColumnDef="firstName">
            <th mat-header-cell *matHeaderCellDef>
              First Name
            </th>
            <td mat-cell *matCellDef="let row">{{ row.firstName }}</td>
          </ng-container>

          <!-- Last Name Column -->
          <ng-container matColumnDef="lastName">
            <th mat-header-cell *matHeaderCellDef >Last Name</th>
            <td mat-cell *matCellDef="let row">{{ row.lastName }}</td>
          </ng-container>

          <!-- Created Date -->
          <ng-container matColumnDef="createdTimestamp">
            <th mat-header-cell *matHeaderCellDef >
              Created Date
            </th>
            <td mat-cell *matCellDef="let row">
              {{ row.createdTimestamp | date: "medium" }}
            </td>
          </ng-container>

          <tr
            mat-header-row
            *matHeaderRowDef="displayedColumns; sticky: true"
          ></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

          <!-- Row shown when there is no matching data. -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="4" class="py-4">
              No data matching the search "{{ input.value }}"
            </td>
          </tr>
        </table>
      </mat-card-content>
    </mat-card>
  </div>
</div>
