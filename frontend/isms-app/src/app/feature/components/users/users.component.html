<div class="container mx-auto">
  <mat-card appearance="outlined" class="!bg-white !rounded-lg !border-none">
    <mat-card-header
      class="flex flex-col justify-start sm:flex-row sm:items-center sm:justify-between !pt-6 !pb-4 !px-6"
    >
      <mat-card-title>Manage Users</mat-card-title>
      <mat-card-subtitle>Manage Users</mat-card-subtitle>

      <div>
        <button
          mat-stroked-button
          class="m-1 sm:my-2"
          (click)="openAddUserDialog()"
        >
          Add New User
        </button>
        <mat-form-field
          appearance="outline"
          subscriptSizing="dynamic"
          class="w-full sm:w-fit sm:my-2 m-1"
          placeholder="Search"
        >
          <mat-label>Search</mat-label>
          <input matInput (keyup)="applyFilter($event)" #input />
          <mat-icon matPrefix>search</mat-icon>
        </mat-form-field>
      </div>
    </mat-card-header>
    <mat-card-content class="overflow-x-auto !px-6 max-h-[calc(100vh-300px)]">
      <div
        *ngIf="!dataSource"
        class="flex flex-col items-center justify-center py-4"
      >
        <mat-spinner diameter="45"></mat-spinner>
      </div>
      <table
        mat-table
        [dataSource]="dataSource"
        class="!bg-white !border !border-solid !border-gray-200 rounded-lg p-1"
      >

      <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Ful Name</th>
          <td mat-cell *matCellDef="let row">
            {{ row.firstName }} {{ row.lastName }}
          </td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let row">
            {{ row.email }}
          </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let row">
            {{ row.firstName }}{{ row.firstName }}
          </td>
        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns; sticky: true"
        ></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="5" class="py-4 text-center">
            <span class="flex items-center gap-2 w-full">
              <mat-icon> search_off </mat-icon>
              <span> No users found "{{ input.value }}" </span>
            </span>
          </td>
        </tr>
      </table>
    </mat-card-content>
    <mat-card-actions align="end">
      <mat-paginator
        [pageSizeOptions]="[5, 10, 25]"
        aria-label="Select page of users"
        class="w-full sm:w-fit my-2 py-2 !bg-white"
        (page)="onPageChange($event)"
        [length]="totalUsers"
      >
      </mat-paginator>
    </mat-card-actions>
  </mat-card>
</div>
