<div class="min-h-screen flex items-center justify-center bg-slate-200">
  <mat-card class="w-full max-w-lg px-6 pb-4 pt-8">
    <app-logo></app-logo>
    <mat-card-header class="mb-6">
      <mat-card-title>Welcome Back</mat-card-title>
      <mat-card-subtitle>Sign in to your ISMS account</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <app-message
        *ngIf="isLoginFailed()"
        [message]="signinStatus()!.message"
        [type]="signinStatus()!.type"
      ></app-message>
      <form
        [formGroup]="signinForm"
        (ngSubmit)="onSubmit()"
        novalidate
        aria-labelledby="signin-title"
      >
        <!-- Email Address -->
        <div class="mb-2">
          <mat-form-field
            appearance="outline"
            class="w-full"
            subscriptSizing="dynamic"
          >
            <mat-label>Email Address</mat-label>
            <input
              matInput
              formControlName="email"
              autocomplete="email"
              type="email"
              placeholder
              maxlength="255"
              aria-required="true"
              autofocus
              (focus)="clearError()"
            />
            <mat-error>
              <span *ngIf="f['email'].hasError('required')"
                >Email address is required</span
              >
              <span *ngIf="f['email'].hasError('email')"
                >Please enter a valid email address</span
              >
            </mat-error>
          </mat-form-field>
        </div>

        <!-- Password -->
        <div class="mb-2">
          <mat-form-field
            appearance="outline"
            class="w-full"
            subscriptSizing="dynamic"
          >
            <mat-label>Password</mat-label>
            <input
              matInput
              formControlName="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              [type]="hidePassword() ? 'password' : 'text'"
              aria-required="true"
              maxlength="128"
              (focus)="clearError()"
            />
            <button
              type="button"
              mat-icon-button
              matSuffix
              (click)="togglePassword($event)"
              [attr.aria-label]="
                hidePassword() ? 'Show password' : 'Hide password'
              "
              [attr.aria-pressed]="!hidePassword()"
              tabindex="-1"
            >
              <mat-icon>{{
                hidePassword() ? "visibility_off" : "visibility"
              }}</mat-icon>
            </button>
            <mat-error>
              <span *ngIf="f['password'].hasError('required')"
                >Password is required</span
              >
            </mat-error>
          </mat-form-field>
        </div>

        <!-- Forgot Password -->
        <div class="flex flex-row justify-end items-center">
          <a
            routerLink="/forgot-password"
            class="text-sm no-underline hover:underline"
          >
            Forgot Password?
          </a>
        </div>

        <!-- Signin Button -->
        <div class="flex justify-center py-2">
          <button
            type="submit"
            mat-flat-button
            color="primary"
            class="min-w-[240px] h-11 mat-elevation-z0"
            [disabled]="isLoading()"
            [attr.aria-busy]="isLoading()"
            [attr.aria-label]="
              isLoading()
                ? 'Signing in, please wait'
                : 'Sign in to your account'
            "
          >
            <span class="flex items-center justify-center gap-3">
              <mat-spinner *ngIf="isLoading()" diameter="20" strokeWidth="3">
              </mat-spinner>
              <span>
                {{ isLoading() ? "Signing In..." : "Sign In" }}
              </span>
            </span>
          </button>
        </div>
      </form>
    </mat-card-content>

    <mat-card-actions class="w-full flex flex-row justify-center items-center">
      <div class="text-sm text-slate-800">
        Don't have an account?
        <a routerLink="/signup" class="no-underline hover:underline">
          Create Account
        </a>
      </div>
    </mat-card-actions>
  </mat-card>
</div>
